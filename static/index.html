<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Analysis Pipeline</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success-color: #10b981;
            --error-color: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
            ring: 2px solid rgba(59, 130, 246, 0.5);
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .checkbox-grid .checkbox-group {
            margin-bottom: 0;
        }

        .checkbox-grid label {
            margin-bottom: 0;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        input[type="checkbox"] {
            width: 1.25rem;
            height: 1.25rem;
            accent-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 1rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: var(--text-secondary);
            cursor: not-allowed;
            opacity: 0.7;
        }

        #results-area {
            background-color: #0f172a;
            /* Slightly darker for code */
            font-family: 'Fira Code', 'Consolas', monospace;
            white-space: pre-wrap;
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
            font-size: 0.9rem;
            padding: 1rem;
            border-radius: 0.5rem;
            color: #e2e8f0;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .status-idle {
            background-color: var(--border-color);
            color: var(--text-secondary);
        }

        .status-running {
            background-color: var(--accent-color);
            color: white;
            animation: pulse 2s infinite;
        }

        .status-success {
            background-color: var(--success-color);
            color: #022c22;
        }

        .status-error {
            background-color: var(--error-color);
            color: white;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }

            100% {
                opacity: 1;
            }
        }

        /* Markdown Styling Sim */
        h2 {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-top: 1.5rem;
            color: var(--text-primary);
        }

        h3 {
            margin-top: 1.25rem;
            color: #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }

        th,
        td {
            border: 1px solid var(--border-color);
            padding: 0.5rem;
            text-align: left;
        }

        th {
            background-color: var(--bg-color);
        }

        .loading-overlay {
            display: none;
            justify-content: center;
            align-items: center;
            margin-top: 1rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>Agentic Analysis Pipeline</h1>
            <p class="subtitle">Configure and run the full stock analysis engine.</p>
        </header>

        <div class="grid">
            <!-- Configuration Panel -->
            <div class="card">
                <h2 style="margin-top:0">Parameters</h2>
                <form id="analysis-form">

                    <div class="form-group">
                        <label for="min_history">Min History (Years)</label>
                        <input type="number" id="min_history" value="5.0" step="0.5" min="1">
                    </div>

                    <div class="form-group">
                        <label for="min_ipo">Min IPO Age (Years)</label>
                        <input type="number" id="min_ipo" value="5.0" step="0.5" min="0">
                    </div>

                    <div class="form-group">
                        <label for="max_ipo">Max IPO Age (Years)</label>
                        <input type="number" id="max_ipo" value="10.0" step="0.5" min="0">
                    </div>

                    <div class="form-group">
                        <label for="min_market_cap">Min Market Cap ($B)</label>
                        <input type="number" id="min_market_cap" placeholder="e.g. 1.0" step="0.1" min="0">
                    </div>

                    <div class="form-group">
                        <label for="max_pe">Max P/E Ratio (Optional)</label>
                        <input type="number" id="max_pe" placeholder="e.g. 25.0" step="0.5" min="0">
                    </div>

                    <div class="form-group">
                        <label for="min_price">Min Current Price ($) (Optional)</label>
                        <input type="number" id="min_price" placeholder="e.g. 10" step="0.01" min="0">
                    </div>

                    <div class="form-group">
                        <label for="max_price">Max Current Price ($) (Optional)</label>
                        <input type="number" id="max_price" placeholder="e.g. 500" step="0.01" min="0">
                    </div>

                    <div class="form-group">
                        <label for="max_pages">Max Search Pages</label>
                        <input type="number" id="max_pages" value="200" step="1" min="1">
                        <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem;">200 pages ≈
                            20,000 stocks</div>
                    </div>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="nyse_nasdaq_only" checked>
                        <label for="nyse_nasdaq_only" style="margin-bottom: 0; cursor: pointer;">NYSE/NASDAQ Only</label>
                    </div>

                    <div class="form-group">
                        <label>Sectors (select to filter — leave all unchecked for all)</label>
                        <div class="checkbox-grid">
                            <div class="checkbox-group"><input type="checkbox" id="sector_technology" value="Technology"><label for="sector_technology">Technology</label></div>
                            <div class="checkbox-group"><input type="checkbox" id="sector_financial" value="Financial Services"><label for="sector_financial">Financial Services</label></div>
                            <div class="checkbox-group"><input type="checkbox" id="sector_healthcare" value="Healthcare"><label for="sector_healthcare">Healthcare</label></div>
                            <div class="checkbox-group"><input type="checkbox" id="sector_consumer_cyclical" value="Consumer Cyclical"><label for="sector_consumer_cyclical">Consumer Cyclical</label></div>
                            <div class="checkbox-group"><input type="checkbox" id="sector_consumer_defensive" value="Consumer Defensive"><label for="sector_consumer_defensive">Consumer Defensive</label></div>
                            <div class="checkbox-group"><input type="checkbox" id="sector_industrials" value="Industrials"><label for="sector_industrials">Industrials</label></div>
                            <div class="checkbox-group"><input type="checkbox" id="sector_energy" value="Energy"><label for="sector_energy">Energy</label></div>
                            <div class="checkbox-group"><input type="checkbox" id="sector_utilities" value="Utilities"><label for="sector_utilities">Utilities</label></div>
                            <div class="checkbox-group"><input type="checkbox" id="sector_real_estate" value="Real Estate"><label for="sector_real_estate">Real Estate</label></div>
                            <div class="checkbox-group"><input type="checkbox" id="sector_basic_materials" value="Basic Materials"><label for="sector_basic_materials">Basic Materials</label></div>
                            <div class="checkbox-group"><input type="checkbox" id="sector_communication" value="Communication Services"><label for="sector_communication">Communication Services</label></div>
                        </div>
                    </div>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="skip_scraper">
                        <label for="skip_scraper" style="margin-bottom: 0; cursor: pointer;">Skip Scraper (Use Cached
                            Data)</label>
                    </div>

                    <button type="submit" id="run-btn">Run Analysis</button>
                    <div id="loading" class="loading-overlay">
                        <span>Running Pipeline... (This may take a while)</span>
                    </div>
                </form>
            </div>

            <!-- Results Panel -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h2 style="margin:0">Output Report</h2>
                    <span id="status-badge" class="status-badge status-idle">Idle</span>
                </div>

                <div id="results-area">
                    Results will appear here...
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('analysis-form');
        const runBtn = document.getElementById('run-btn');
        const loadingDiv = document.getElementById('loading');
        const resultsArea = document.getElementById('results-area');
        const statusBadge = document.getElementById('status-badge');

        let pollInterval = null;
        let isStopping = false;

        // Create Stop Button dynamically or toggle Run button?
        // Let's toggle Run button to Stop button when running

        function setRunningState(running) {
            if (running) {
                runBtn.innerText = "Stop Analysis";
                runBtn.style.backgroundColor = "var(--error-color)";
                runBtn.onclick = stopAnalysis; // Override submit
                loadingDiv.style.display = 'flex';
                statusBadge.className = 'status-badge status-running';
                statusBadge.innerText = 'Running';
            } else {
                runBtn.innerText = "Run Analysis";
                runBtn.style.backgroundColor = "var(--accent-color)";
                runBtn.onclick = null; // Revert to submit
                runBtn.disabled = false;
                loadingDiv.style.display = 'none';
            }
        }

        async function stopAnalysis(e) {
            if (e) e.preventDefault();
            if (isStopping) return;
            isStopping = true;
            runBtn.innerText = "Stopping...";
            runBtn.disabled = true;

            try {
                await fetch('/stop', { method: 'POST' });
            } catch (err) {
                console.error("Failed to stop:", err);
            }
        }

        // Handle Run
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (runBtn.innerText.includes("Stop")) {
                stopAnalysis(e);
                return;
            }

            // Clear previous
            resultsArea.innerText = "Initializing pipeline...\n";
            isStopping = false;

            // Collect Params - use valueAsNumber for numeric inputs to avoid string/empty edge cases
            const maxPeVal = document.getElementById('max_pe').value;
            const minMarketCapVal = document.getElementById('min_market_cap').value;
            const minPriceEl = document.getElementById('min_price');
            const maxPriceEl = document.getElementById('max_price');
            const minPriceNum = minPriceEl.value !== '' ? parseFloat(minPriceEl.value) : NaN;
            const maxPriceNum = maxPriceEl.value !== '' ? parseFloat(maxPriceEl.value) : NaN;

            const industriesChecked = Array.from(document.querySelectorAll('input[id^="sector_"]'))
                .filter(cb => cb.checked)
                .map(cb => cb.value || cb.getAttribute('value'));
            const payload = {
                min_history: parseFloat(document.getElementById('min_history').value),
                min_ipo: parseFloat(document.getElementById('min_ipo').value),
                max_ipo: parseFloat(document.getElementById('max_ipo').value),
                min_market_cap: minMarketCapVal ? parseFloat(minMarketCapVal) : null,
                max_pe: maxPeVal ? parseFloat(maxPeVal) : null,
                min_price: (!isNaN(minPriceNum) && minPriceNum >= 0) ? minPriceNum : null,
                max_price: (!isNaN(maxPriceNum) && maxPriceNum >= 0) ? maxPriceNum : null,
                no_exchange_filter: !document.getElementById('nyse_nasdaq_only').checked,
                industries: industriesChecked.length > 0 ? industriesChecked : null,
                max_pages: parseInt(document.getElementById('max_pages').value),
                skip_scraper: document.getElementById('skip_scraper').checked
            };

            try {
                // 1. Start Analysis
                const startResp = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!startResp.ok) {
                    const err = await startResp.json();
                    throw new Error(err.detail || "Failed to start");
                }

                // 2. Enter Running State
                setRunningState(true);

                // 3. Start Polling
                pollInterval = setInterval(pollStatus, 1000);

            } catch (error) {
                statusBadge.className = 'status-badge status-error';
                statusBadge.innerText = 'Error';
                resultsArea.innerText += `\nError starting: ${error.message}`;
            }
        });

        async function pollStatus() {
            try {
                const resp = await fetch('/status');
                const data = await resp.json();

                // Update Logs
                // Simple scroll to bottom if at bottom?
                const atBottom = resultsArea.scrollTop + resultsArea.clientHeight >= resultsArea.scrollHeight - 50;
                resultsArea.innerText = data.logs || "Waiting for logs...";
                if (atBottom) resultsArea.scrollTop = resultsArea.scrollHeight;

                // Check Status
                if (data.status === 'completed') {
                    clearInterval(pollInterval);
                    setRunningState(false);
                    statusBadge.className = 'status-badge status-success';
                    statusBadge.innerText = 'Complete';
                    if (data.report) resultsArea.innerText = data.report; // Show report on top? Or just logs? 
                    // Let's show report if available, else logs
                    if (data.report) resultsArea.innerText = data.report;
                } else if (data.status === 'error' || data.status === 'stopped') {
                    clearInterval(pollInterval);
                    setRunningState(false);
                    statusBadge.className = 'status-badge status-error';
                    statusBadge.innerText = data.status === 'stopped' ? 'Stopped' : 'Error';
                }

            } catch (e) {
                console.error("Poll error:", e);
            }
        }
    </script>

</body>

</html>
