# Google Cloud Build - builds and deploys to Cloud Run
# Usage: gcloud builds submit --config=cloudbuild.yaml

steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Verifying static/index.html contains new UI..."
        if ! grep -q "Portfolio Compare" static/index.html; then
          echo "ERROR: static/index.html missing 'Portfolio Compare' - wrong or stale file"
          exit 1
        fi
        if ! grep -q "sector-pe-grid" static/index.html; then
          echo "ERROR: static/index.html missing sector P/E filter - wrong or stale file"
          exit 1
        fi
        echo "Static files verified OK"

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stock-analysis-api:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stock-analysis-api:latest'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/stock-analysis-api:$BUILD_ID'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/stock-analysis-api:latest'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'stock-analysis-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/stock-analysis-api:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '3600'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'

images:
  - 'gcr.io/$PROJECT_ID/stock-analysis-api:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/stock-analysis-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
